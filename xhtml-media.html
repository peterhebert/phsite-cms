<h2>Quicktime</h2>
<!-- Start XHTML Quicktime -->
<object classid="clsid:02BF25D5-8C17-4B23-BC80-D3488ABDDC6B" codebase="http://www.apple.com/qtactivex/qtplugin.cab" width="320" height="260">
 <param name="src" value="the_leaves.mov" />
 <param name="controller" value="true" />
 <param name="autoplay" value="false" />
 <object type="video/quicktime" data="the_leaves.mov" width="320" height="260" class="mov">
 <param name="autoplay" value="false" />
  <param name="controller" value="true" />
		No video? <a href="http://www.apple.com/quicktime/download/">Get quicktime</a>
 </object>
</object>
<!-- End XHTML Quicktime -->

<h2>Flash</h2>
<!-- Start XHTML Flash -->
<object type="application/x-shockwave-flash" data="http://www.youtube.com/v/a0qMe7Z3EYg" height="280" width="480">
	<param name="movie" value="http://www.youtube.com/v/a0qMe7Z3EYg" />
	<param name="FlashVars" value="playerMode=embedded" />
</object>
<!-- FYI, that super small flash code works on everything from youtube / swf's / all other movie sites...-->
<!-- End XHTML Flash -->
