<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Untitled Document</title>
<link href="/assets/css/reset.css" rel="stylesheet" type="text/css" />
<link href="/assets/css/fonts.css" rel="stylesheet" type="text/css" />
<link href="/assets/css/admin.css" rel="stylesheet" type="text/css" />

</head>

<body>
<form id="form1" method="post" action="">
<div class="align-labels label-normal">
	<p>
		<label>Radio Buttons</label>
	<span class="radiogroup">
		<label><input type="radio" name="mylist[]" value="0" id="mylist_0" /> zero</label>
		<label><input type="radio" name="mylist[]" value="1" id="mylist_1" /> one</label>
	</span>
	</p>

	<p>
		<label>Checkboxes</label>
	<span class="radiogroup">
		<label><input type="checkbox" name="mylist[]" value="0" id="mylist_0" /> zero</label>
		<label><input type="checkbox" name="mylist[]" value="1" id="mylist_1" /> one</label>
	</span>
	</p>

	<p><label for="select">Single select</label>
	<select name="select">
		<option value="1">one</option>
		<option value="2">two</option>
		<option value="3">three</option>
	</select>
	</p>
	<p><label for="multiple">Multiple select</label>
	<select name="multiple" size="3" multiple="multiple">
		<option value="1">one</option>
		<option value="2">two</option>
		<option value="3">three</option>
	</select>
	</p>
</div>

</form>
</body>
</html>
